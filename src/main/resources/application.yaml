spring:
  application:
    name: community

  datasource:
    url: jdbc:mysql://localhost:3306/community_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: ${DB_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8081